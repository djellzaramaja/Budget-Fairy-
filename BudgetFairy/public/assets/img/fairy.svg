  <ellipse cx="89" cy="80" rx="3.6" ry="4.6" fill="#3b2a4f"/><ellipse cx="111" cy="80" rx="3.6" ry="4.6" fill="#3b2a4f"/>
  <circle cx="90.3" cy="78.4" r="1.3" fill="#fff"/><circle cx="112.3" cy="78.4" r="1.3" fill="#fff"/>
  <path d="M85 74 q4 -3 8 0 M107 74 q4 -3 8 0" stroke="#3b2a4f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="80" cy="89" rx="5.5" ry="3.4" fill="#ff9fb8" opacity=".6"/><ellipse cx="120" cy="89" rx="5.5" ry="3.4" fill="#ff9fb8" opacity=".6"/>
  <path d="M93 92 Q100 99 107 92" stroke="#c4566f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- flower in hair -->
  <g transform="translate(78 54)"><circle r="3" fill="#ffd166"/><g fill="#fff"><circle cx="0" cy="-5" r="3"/><circle cx="5" cy="-1.5" r="3"/><circle cx="3" cy="4.5" r="3"/><circle cx="-3" cy="4.5" r="3"/><circle cx="-5" cy="-1.5" r="3"/></g><circle r="2.6" fill="#ffd166"/></g>
</svg>
