<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Fia the fairy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2dc"/><stop offset="1" stop-color="#b9a4f0"/></linearGradient>
    <linearGradient id="wg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8ecde"/><stop offset="1" stop-color="#a9cdf7"/></linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f48fb8"/><stop offset="1" stop-color="#9d7be0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- wings -->
  <g opacity=".85">
    <ellipse cx="62" cy="112" rx="46" ry="30" transform="rotate(-28 62 112)" fill="url(#wg)" stroke="#fff" stroke-width="2"/>
    <ellipse cx="138" cy="112" rx="46" ry="30" transform="rotate(28 138 112)" fill="url(#wg)" stroke="#fff" stroke-width="2"/>
    <ellipse cx="70" cy="150" rx="30" ry="19" transform="rotate(28 70 150)" fill="url(#wg2)" stroke="#fff" stroke-width="2"/>
    <ellipse cx="130" cy="150" rx="30" ry="19" transform="rotate(-28 130 150)" fill="url(#wg2)" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- long hair (back) -->
  <path d="M58 76 C56 38 144 38 142 76 C154 104 150 142 134 162 C126 150 120 122 118 94 L82 94 C80 122 74 150 66 162 C50 142 46 104 58 76 Z" fill="#6b3f86"/>
  <!-- hair bun + star -->
  <circle cx="100" cy="28" r="17" fill="#6b3f86"/>
  <path d="M100 8 l3.5 7.5 8 1 -6 5.5 1.7 8 -7.2-4 -7.2 4 1.7-8 -6-5.5 8-1z" fill="#ffd166" stroke="#fff" stroke-width="1.2"/>
  <!-- dress -->
  <path d="M82 118 Q100 108 118 118 L138 190 Q100 204 62 190 Z" fill="url(#dress)"/>
  <path d="M66 184 Q100 198 134 184" stroke="#fff" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round"/>
  <path d="M74 160 Q100 170 126 160" stroke="#fff" stroke-width="1.5" fill="none" opacity=".5" stroke-linecap="round"/>
  <!-- legs + shoes -->
  <rect x="88" y="196" width="7" height="20" rx="3.5" fill="#f3c6a5"/><rect x="105" y="196" width="7" height="20" rx="3.5" fill="#f3c6a5"/>
  <ellipse cx="90" cy="219" rx="9" ry="5" fill="#9d7be0"/><ellipse cx="110" cy="219" rx="9" ry="5" fill="#9d7be0"/>
  <!-- arms -->
  <path d="M84 124 Q66 134 62 150" stroke="#f3c6a5" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M116 124 Q136 120 148 100" stroke="#f3c6a5" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- wand + sparkle -->
  <line x1="148" y1="100" x2="166" y2="66" stroke="#c9a14a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="168" cy="60" r="20" fill="url(#glow)"/>
  <path d="M168 48 l4 8.5 9 1.2 -6.6 6.2 1.8 9 -8.2-4.5 -8.2 4.5 1.8-9 -6.6-6.2 9-1.2z" fill="#ffd166" stroke="#fff" stroke-width="1.2"/>
  <path d="M184 86 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8-4 -4-1.8 4-1.8z M40 70 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4-3 -3-1.4 3-1.4z" fill="#ffd166"/>
  <!-- head -->
  <circle cx="100" cy="76" r="30" fill="#f3c6a5"/>
  <!-- fringe -->
  <path d="M70 72 C70 46 130 46 130 72 C122 62 112 58 104 60 C96 56 80 60 70 72 Z" fill="#6b3f86"/>
